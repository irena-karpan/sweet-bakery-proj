<section class="section desserts" id="desserts-list">
  <div class="container desserts__container">
    <div class="desserts__header">
      <div class="desserts__heading">
        <h2 class="desserts__title">Солодощі</h2>
        <p class="desserts__description">
          Спробуйте наші смачні десерти, які вас здивують!
        </p>
      </div>

      <div class="desserts__select-wrapper">
        <div class="desserts-dropdown">
          <button
            class="desserts-dropdown__trigger"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span class="desserts-dropdown__value">Всі десерти</span>

            <svg
              class="desserts-dropdown__icon"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M7 10l5 5 5-5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>

          <ul
            class="desserts-dropdown__menu"
            role="listbox"
            aria-label="Категорії десертів"
            hidden
          >
            <li>
              <button
                class="desserts-dropdown__option is-active"
                type="button"
                role="option"
                aria-selected="true"
                data-category-id=""
              >
                Всі десерти
              </button>
            </li>
          </ul>
          <div class="desserts-dropdown__scrollbar" aria-hidden="true">
            <div class="desserts-dropdown__scrollbar-thumb"></div>
          </div>
        </div>
      </div>
    </div>

    <div
      class="desserts__categories"
      role="group"
      aria-label="Категорії десертів"
    >
      <button
        class="desserts__category is-active"
        type="button"
        data-category-id=""
      >
        Всі десерти
      </button>
    </div>

    <div
      class="loader desserts__loader"
      role="status"
      aria-label="Завантаження десертів"
      hidden
    ></div>

    <ul class="desserts__grid" aria-live="polite"></ul>

    <button class="desserts__load-more" type="button" hidden>
      Завантажити ще
    </button>
  </div>
</section>
