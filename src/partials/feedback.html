<section class="feedback-section" id="feedback">
  <div class="container feedback-container">
    <h2 class="feedback-title">Відгуки Клієнтів</h2>

    <p class="feedback-subtitle">
      Найкращі десерти, які я коли-небудь куштував!
    </p>

    <div class="feedback-loader-wrapper hidden" id="feedback-loader">
      <div class="loader"></div>
    </div>

    <div class="feedback-slider">
      <div class="feedback-swiper swiper">
        <ul
          class="feedback-list swiper-wrapper"
          id="sweet-factory-feedback-list"
        ></ul>
      </div>

      <div class="feedback-controls is-hidden">
        <div class="wrapper-pagination">
          <div class="feedback-pagination swiper-pagination"></div>
        </div>

        <div class="feedback-navigation-buttons">
          <button
            class="feedback-button feedback-button-prev"
            type="button"
            aria-label="Попередній відгук"
          >
            <svg
              class="feedback-button-icon"
              width="24"
              height="24"
              aria-hidden="true"
            >
              <use href="./img/sprite.svg#arrow_back-icon"></use>
            </svg>
          </button>

          <button
            class="feedback-button feedback-button-next"
            type="button"
            aria-label="Наступний відгук"
          >
            <svg
              class="feedback-button-icon"
              width="24"
              height="24"
              aria-hidden="true"
            >
              <use href="./img/sprite.svg#arrow_forward-icon"></use>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
