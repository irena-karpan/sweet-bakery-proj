<section class="feedback-section" id="feedback">
  <div class="container feedback-container">
    <h2 class="feedback-title">Відгуки Клієнтів</h2>
    <p class="feedback-subtitle">
      Дізнайтеся, що кажуть наші задоволені клієнти...
    </p>

    <div class="feedback-loader-wrapper hidden" id="feedback-loader">
      <div class="loader"></div>
    </div>

    <div class="swiper feedback-swiper">
      <ul
        class="swiper-wrapper feedback-list"
        id="sweet-factory-feedback-list"
      ></ul>
    </div>

    <div class="feedback-controls">
      <div class="feedback-pagination swiper-pagination"></div>

      <div class="feedback-navigation-buttons">
        <button
          type="button"
          class="feedback-btn feedback-btn-prev"
          aria-label="Previous slide"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>

        <button
          type="button"
          class="feedback-btn feedback-btn-next"
          aria-label="Next slide"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
